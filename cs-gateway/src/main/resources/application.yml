server:
  port: ${CS_PORT:8096}

spring:
  application:
    name: cs-pro
  config:
    import:
      - "optional:file:./config/llm.properties"
      - "optional:file:./config/payment-pro.properties"
      - "optional:file:${user.home}/.config/cs-pro/llm.properties"
      - "optional:file:${user.home}/.config/cs-pro/payment-pro.properties"
  datasource:
    url: jdbc:h2:file:${DATA_DIR:./data}/cs;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jackson:
    default-property-inclusion: non_null

mybatis:
  configuration:
    map-underscore-to-camel-case: true

cs:
  ride:
    base-url: ${RIDE_BASE_URL:http://127.0.0.1:8090}
  pp:
    base-url: ${base-url:}
    app-id: ${app-id:}
    app-secret: ${app-secret:}
    cert-path: ${cert-path:}
  admin:
    token: ${ADMIN_TOKEN:cs-admin}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
  level:
    com.qoder.cs: info