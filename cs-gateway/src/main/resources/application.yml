server:
  port: ${CS_PORT:8096}

spring:
  application:
    name: cs-pro
  config:
    import:
      - "optional:file:./config/llm.properties"
      - "optional:file:./config/payment-pro.properties"
      - "optional:file:${user.home}/.config/cs-pro/llm.properties"
      - "optional:file:${user.home}/.config/cs-pro/payment-pro.properties"
  datasource:
    url: jdbc:h2:file:${DATA_DIR:./data}/cs;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true

cs:
  db:
    mode: ${CS_DB_MODE:h2}
  chat:
    # 每租户 LLM 并发上限（0=不限）；超限立即 429
    tenant-concurrency: ${CS_TENANT_CONCURRENCY:2}
  kb:
    # TopK 检索结果缓存 TTL（毫秒，0=关闭）；KB 变更即时失效
    cache-ttl-ms: ${CS_KB_CACHE_TTL_MS:30000}
  vector:
    # 混合检索（BM25+向量 RRF）；容器不可达自动降级纯 BM25
    enabled: ${CS_VECTOR_ENABLED:true}
    qdrant-url: ${CS_QDRANT_URL:http://127.0.0.1:6333}
    embedding-url: ${CS_EMBEDDING_URL:http://127.0.0.1:8100}
    collection: cs_kb
    rrf-k: 60
    timeout-ms: 3000
  uploads:
    dir: ${DATA_DIR:./data}/uploads
  proactive:
    # 主动服务轮询（ride 超时订单 / payment 失败支付单）；上游未跑自动跳过
    enabled: ${CS_PROACTIVE_ENABLED:true}
    interval-ms: ${CS_PROACTIVE_INTERVAL_MS:60000}
    lookback-hours: 24
    max-per-poll: 10
  ride:
    base-url: ${RIDE_BASE_URL:http://127.0.0.1:8090}
  pp:
    base-url: ${base-url:}
    app-id: ${app-id:}
    app-secret: ${app-secret:}
    cert-path: ${cert-path:}
    # 主动服务用内部只读 API（留空=禁用 payment 事件源）
    poll-base-url: ${CS_PP_POLL_BASE_URL:http://127.0.0.1:8080}
  admin:
    token: ${ADMIN_TOKEN:cs-admin}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
  level:
    com.qoder.cs: info