<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理后台 · cs-pro</title>
<link rel="stylesheet" href="common.css">
</head>
<body>
<div class="topbar">
  <h1>管理后台</h1>
  <span class="spacer"></span>
  <a href="agent.html">工单工作台</a>
  <a href="index.html">首页</a>
</div>
<div class="wrap">
  <div class="card">
    <div class="row">
      <div style="flex:1;min-width:200px">
        <label>管理令牌（X-Admin-Token）</label>
        <input id="token" type="password" placeholder="默认 cs-admin">
      </div>
      <button onclick="saveToken();refresh()" style="align-self:flex-end">保存并刷新</button>
    </div>
  </div>

  <div class="tabs">
    <button data-tab="overview" class="active" onclick="switchTab('overview')">运营总览</button>
    <button data-tab="sessions" onclick="switchTab('sessions')">会话审计</button>
    <button data-tab="kb" onclick="switchTab('kb')">FAQ 知识库</button>
    <button data-tab="llm" onclick="switchTab('llm')">LLM 审计</button>
    <button data-tab="sub" onclick="switchTab('sub')">租户与订阅</button>
    <button data-tab="audit" onclick="switchTab('audit')">审计与坏例</button>
    <button data-tab="open" onclick="switchTab('open')">开放与账单</button>
  </div>

  <div id="tab-overview">
    <div class="card"><div class="grid cols-4" id="statCards"></div></div>
    <div class="grid cols-2">
      <div class="card"><h2>近 7 天趋势</h2><div id="trend"></div></div>
      <div class="card"><h2>系统状态</h2><div id="sysStatus"></div></div>
    </div>
    <div class="card"><h2>热门 FAQ</h2><div id="hotFaq"></div></div>
    <div class="card">
      <h2>知识库引用解决率</h2>
      <div class="muted" style="margin-bottom:6px">近似口径：被引用满 7 天观察期、会话后续 7 天无工单且会话无差评 = 已解决。</div>
      <div id="kbCitation"></div>
    </div>
  </div>

  <div id="tab-sessions" style="display:none">
    <div class="card">
      <h2>会话列表</h2>
      <div class="row" style="margin-bottom:10px">
        <select id="sessStatus" onchange="loadSessions(1)" style="max-width:160px">
          <option value="">全部状态</option><option value="ACTIVE">进行中</option><option value="ENDED">已结束</option>
        </select>
      </div>
      <div id="sessionList"></div>
      <div id="sessPager"></div>
    </div>
    <div class="card" id="sessMsgCard" style="display:none">
      <h2>会话消息 <span class="mono" id="sessMsgId"></span></h2>
      <div id="sessMsgs"></div>
    </div>
  </div>

  <div id="tab-kb" style="display:none">
    <div class="card">
      <h2>向量检索（BM25 + 向量混合）
        <button class="small ghost" onclick="loadVectorStatus()">刷新</button>
        <button class="small" onclick="kbReindex()">重建向量索引</button></h2>
      <div id="vectorStatus" class="muted">加载中…</div>
    </div>
    <div class="card">
      <h2>新增 FAQ</h2>
      <div class="grid cols-2">
        <div><label>问题</label><input id="kbQ"></div>
        <div><label>分类</label><input id="kbCat" placeholder="计价/支付/退款/提现/订阅/其他"></div>
      </div>
      <label style="margin-top:8px">答案</label><textarea id="kbA"></textarea>
      <label style="margin-top:8px">关键词（逗号分隔，可选）</label><input id="kbKw">
      <div style="margin-top:10px">
        <button id="kbSaveBtn" onclick="kbSave()">新增</button>
        <button class="ghost" onclick="kbEditCancel()">取消编辑</button>
      </div>
    </div>
    <div class="card"><h2>FAQ 列表 <span class="muted" id="kbCount"></span></h2><div id="kbList"></div></div>
    <div class="card" id="kbVerCard" style="display:none">
      <h2>历史版本 <span class="mono" id="kbVerId"></span></h2>
      <div id="kbVersions"></div>
    </div>
  </div>

  <div id="tab-llm" style="display:none">
    <div class="card">
      <h2>LLM 调用记录</h2>
      <div class="row" style="margin-bottom:10px">
        <select id="llmStatus" onchange="loadLlm(1)" style="max-width:180px">
          <option value="">全部</option><option value="OK">成功 OK</option>
          <option value="ERROR">失败 ERROR</option><option value="FALLBACK">FAQ 降级</option>
          <option value="BUDGET">预算降级</option><option value="ABORTED">断流</option>
          <option value="CIRCUIT">熔断</option>
        </select>
      </div>
      <div id="llmList"></div>
      <div id="llmPager"></div>
    </div>
  </div>

  <div id="tab-sub" style="display:none">
    <div class="card">
      <h2>租户订阅状态</h2>
      <div id="subList"></div>
      <div id="subPager"></div>
      <div class="row" style="margin-top:12px">
        <input id="grantTenant" placeholder="租户 ID（如 TN1）" style="max-width:160px">
        <input id="grantDays" type="number" value="30" style="max-width:100px">
        <button onclick="grant()">手动开通/续订（天）</button>
      </div>
    </div>
    <div class="grid cols-2">
      <div class="card">
        <h2>激活码</h2>
        <div class="row" style="margin-bottom:8px">
          <select id="codeStatus" onchange="loadCodes(1)" style="max-width:140px">
            <option value="">全部状态</option><option value="UNUSED">未使用</option><option value="USED">已使用</option>
          </select>
        </div>
        <div id="codeList"></div>
        <div id="codePager"></div>
        <div class="row" style="margin-top:12px">
          <input id="codeDays" type="number" value="30" style="max-width:100px">
          <input id="codeCount" type="number" value="3" style="max-width:100px">
          <button onclick="genCodes()">生成激活码</button>
        </div>
      </div>
      <div class="card">
        <h2>新建租户</h2>
        <div class="row">
          <input id="newCode" placeholder="编码（字母数字_-）" style="flex:1">
          <input id="newName" placeholder="名称" style="flex:1">
          <button onclick="createTenant()">创建</button>
        </div>
        <h2 style="margin-top:14px">订阅支付单</h2>
        <div id="subOrders"></div>
        <div id="orderPager"></div>
      </div>
    </div>
  </div>

  <div id="tab-audit" style="display:none">
    <div class="card">
      <h2>管理操作审计</h2>
      <div class="row" style="margin-bottom:10px">
        <input id="auditAction" placeholder="按动作过滤（如 KB_UPDATE）" style="max-width:260px"
               onkeydown="if(event.key==='Enter')loadAudit(1)">
        <button class="small" onclick="loadAudit(1)">查询</button>
      </div>
      <div id="auditList"></div>
      <div id="auditPager"></div>
    </div>
    <div class="card">
      <h2>坏例队列</h2>
      <div class="muted" style="margin-bottom:6px">差评 / 智能助手降级的会话；点开查看上下文，再到 FAQ 知识库页签改进条目。</div>
      <div id="badList"></div>
      <div id="badPager"></div>
      <div id="badDetail"></div>
    </div>
    <div class="card">
      <h2>主动服务事件</h2>
      <div id="evtList"></div>
      <div id="evtPager"></div>
    </div>
  </div>

  <div id="tab-open" style="display:none">
    <div class="card">
      <h2>开放 API 凭证（X-Open-Key）</h2>
      <div class="row" style="margin-bottom:10px">
        <input id="keyTenant" placeholder="按租户编码过滤（如 ride-pro）" style="max-width:240px"
               onkeydown="if(event.key==='Enter')loadKeys(1)">
        <button class="small" onclick="loadKeys(1)">查询</button>
        <span class="spacer"></span>
        <input id="keyGenTenant" placeholder="租户编码" style="max-width:160px">
        <button class="small" onclick="genKey()">生成凭证</button>
      </div>
      <div id="keyNew"></div>
      <div id="keyList"></div>
      <div id="keyPager"></div>
    </div>
    <div class="card">
      <h2>月度账单</h2>
      <div class="row" style="margin-bottom:10px">
        <input id="invTenant" placeholder="租户编码（可选）" style="max-width:180px">
        <input id="invPeriod" placeholder="账期 YYYY-MM（可选）" style="max-width:180px"
               onkeydown="if(event.key==='Enter')loadInv(1)">
        <button class="small" onclick="loadInv(1)">查询</button>
        <span class="spacer"></span>
        <input id="invGenTenant" placeholder="租户编码" style="max-width:160px">
        <input id="invGenPeriod" placeholder="YYYY-MM" style="max-width:120px">
        <button class="small" onclick="genInvoice()">出账</button>
      </div>
      <div id="invList"></div>
      <div id="invPager"></div>
    </div>
  </div>
</div>
<script src="common.js"></script>
<script>
function saveToken() {
  const t = document.getElementById('token').value.trim();
  if (t) localStorage.setItem(CS.tokenKey, t);
}

const TABS = ['overview', 'sessions', 'kb', 'llm', 'sub', 'audit', 'open'];

function switchTab(name) {
  document.querySelectorAll('.tabs button').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === name));
  TABS.forEach(t =>
    document.getElementById('tab-' + t).style.display = t === name ? '' : 'none');
  refresh();
}

async function refresh() {
  const active = document.querySelector('.tabs button.active').dataset.tab;
  try {
    if (active === 'overview') await loadOverview();
    if (active === 'sessions') await loadSessions();
    if (active === 'kb') await loadKb();
    if (active === 'llm') await loadLlm();
    if (active === 'sub') await Promise.all([loadSubs(), loadCodes(), loadOrders()]);
    if (active === 'audit') await Promise.all([loadAudit(), loadBad(), loadEvents()]);
    if (active === 'open') await Promise.all([loadKeys(), loadInv()]);
  } catch (e) { CS.toast(e.message, true); }
}

async function loadOverview() {
  const d = await CS.get('/api/admin/overview');
  const cards = [
    [d.sessions.total, '会话总数'], [d.sessions.today, '今日会话'],
    [d.messages.total, '消息总数'], [d.messages.avgBotLatencyMs + 'ms', '平均响应'],
    [d.tickets.open + d.tickets.processing, '待处理工单'], [d.tickets.today, '今日工单'],
    [d.kb.hits, 'FAQ 命中'], [d.llm.tokens, 'LLM Tokens'],
  ];
  document.getElementById('statCards').innerHTML = cards.map(([n, l]) =>
    `<div class="stat"><div class="num">${n}</div><div class="lbl">${l}</div></div>`).join('');
  const trend = await CS.get('/api/admin/stats/daily?days=7');
  document.getElementById('trend').innerHTML = '<table><tr><th>日期</th><th>会话</th><th>消息</th><th>工单</th></tr>' +
    trend.map(r => `<tr><td>${r.day}</td><td>${r.sessions}</td><td>${r.messages}</td><td>${r.tickets}</td></tr>`).join('') + '</table>';
  const up = d.upstream;
  document.getElementById('sysStatus').innerHTML = `
    <p style="font-size:13px;line-height:2">
      LLM：${d.llm.available ? '<span class="badge ok">可用</span>' : '<span class="badge warn">FAQ 降级模式</span>'}（${CS.esc(d.llm.model)}）<br>
      ride-pro：${up.ridePro ? '<span class="badge ok">在线</span>' : '<span class="badge err">离线</span>'}<br>
      payment-pro OpenAPI：${up.paymentPro ? '<span class="badge ok">已配置</span>' : '<span class="badge gray">未入驻</span>'}<br>
      订阅租户：${d.subscriptions.subscribed}/${d.subscriptions.tenants}<br>
      评分（会话）：${d.ratings.session.avg} 分 / ${d.ratings.session.count} 条
    </p>`;
  const hot = await CS.get('/api/kb/hot?limit=5');
  document.getElementById('hotFaq').innerHTML = hot.length ?
    '<table><tr><th>问题</th><th>分类</th><th>命中</th></tr>' + hot.map(e =>
      `<tr><td>${CS.esc(e.question)}</td><td>${CS.esc(e.category)}</td><td>${e.hitCount}</td></tr>`).join('') + '</table>'
    : '<div class="empty">暂无命中</div>';
  const cites = await CS.get('/api/admin/kb/citation-stats');
  document.getElementById('kbCitation').innerHTML = cites.length ?
    '<table><tr><th>ID</th><th>问题</th><th>被引用</th><th>满7天</th><th>已解决</th><th>解决率</th></tr>' +
    cites.map(r => `<tr><td class="mono">${r.id}</td><td>${CS.esc(r.question)}</td>
      <td>${r.cited}</td><td>${r.matured}</td><td>${r.resolved}</td>
      <td>${r.rate == null ? '<span class="muted">观察期未见</span>' : r.rate + '%'}</td></tr>`).join('') + '</table>'
    : '<div class="empty">暂无知识库条目</div>';
}

// ---- 会话审计 ----
let sessPage = 1;
const SESS_SIZE = 10;

async function loadSessions(page = sessPage) {
  sessPage = page;
  const status = document.getElementById('sessStatus').value;
  const d = await CS.get(`/api/admin/sessions?page=${page}&size=${SESS_SIZE}` + (status ? '&status=' + status : ''));
  document.getElementById('sessionList').innerHTML = d.list.length ?
    '<table><tr><th>会话</th><th>用户</th><th>身份</th><th>租户</th><th>意图</th><th>状态</th><th>创建</th></tr>' +
    d.list.map(s => `<tr style="cursor:pointer" onclick="showMsgs('${s.id}')">
      <td class="mono">${s.id}</td><td>${CS.esc(s.userName)}</td><td>${s.userRole}</td>
      <td>${CS.esc(s.tenantCode)}</td><td>${CS.esc(s.intent || '-')}</td>
      <td>${CS.statusBadge(s.status)}</td><td class="muted">${CS.time(s.createdAt)}</td></tr>`).join('') + '</table>'
    : '<div class="empty">暂无会话</div>';
  CS.pager('sessPager', d.total, page, SESS_SIZE, 'loadSessions');
}

async function showMsgs(id) {
  const list = await CS.get('/api/admin/sessions/' + id + '/messages');
  document.getElementById('sessMsgCard').style.display = '';
  document.getElementById('sessMsgId').textContent = id;
  document.getElementById('sessMsgs').innerHTML = list.map(m => `
    <p style="font-size:13px;margin-bottom:8px">
      <span class="badge ${m.role === 'USER' ? '' : 'gray'}">${m.role}</span>
      <span class="muted">${CS.time(m.createdAt)}${m.toolName ? ' · 工具 ' + CS.esc(m.toolName) : ''}</span><br>
      ${CS.esc(m.content || '')}
      ${m.attachments ? '<span class="attach-strip">' + m.attachments.split(',').map(u =>
        `<a href="${CS.esc(u)}" target="_blank"><img class="thumb" src="${CS.esc(u)}"></a>`).join('') + '</span>' : ''}</p>`).join('') || '<div class="empty">暂无消息</div>';
}

// ---- FAQ 知识库 ----
let kbCache = [];
let editingKb = null;

async function loadVectorStatus() {
  const el = document.getElementById('vectorStatus');
  try {
    const d = await CS.get('/api/admin/kb/vector-status');
    if (!d.enabled) { el.innerHTML = '<span class="badge gray">已关闭</span> 仅 BM25 检索（cs.vector.enabled=false）'; return; }
    const ok = d.embeddingUp && d.qdrantUp;
    el.innerHTML = `${ok ? '<span class="badge ok">混合检索生效</span>' : '<span class="badge warn">向量不可用，已降级 BM25</span>'}
      Embedding ${d.embeddingUp ? '在线' : '离线'} · Qdrant ${d.qdrantUp ? '在线' : '离线'}
      · 已索引 <b>${d.indexed}</b> / 启用条目 ${d.kbTotal}
      · 模型 ${CS.esc(d.model || '-')}（${d.dim} 维）`;
  } catch (e) { el.textContent = e.message; }
}

async function kbReindex() {
  try {
    const d = await CS.post('/api/admin/kb/reindex');
    CS.toast('向量索引重建完成：' + d.indexed + ' 条');
    loadVectorStatus();
  } catch (e) { CS.toast(e.message, true); }
}

async function loadKb() {
  loadVectorStatus();
  const list = await CS.get('/api/admin/kb');
  kbCache = list;
  document.getElementById('kbCount').textContent = '共 ' + list.length + ' 条';
  document.getElementById('kbList').innerHTML = '<table><tr><th>ID</th><th>问题</th><th>分类</th><th>命中</th><th>被引用</th><th>启用</th><th>操作</th></tr>' +
    list.map(e => `<tr><td class="mono">${e.id}</td><td>${CS.esc(e.question)}</td>
      <td>${CS.esc(e.category)}</td><td>${e.hitCount}</td><td>${e.citedCount || 0}</td>
      <td>${e.enabled ? '<span class="badge ok">是</span>' : '<span class="badge gray">否</span>'}</td>
      <td><button class="small ghost" onclick="kbEdit('${e.id}')">编辑</button>
        <button class="small ghost" onclick="kbVersions('${e.id}')">版本</button>
        <button class="small danger" onclick="kbDelete('${e.id}')">删除</button></td></tr>`).join('') + '</table>';
}

function kbEdit(id) {
  const e = kbCache.find(x => x.id === id);
  if (!e) return;
  editingKb = id;
  document.getElementById('kbQ').value = e.question;
  document.getElementById('kbA').value = e.answer;
  document.getElementById('kbCat').value = e.category;
  document.getElementById('kbKw').value = e.keywords || '';
  document.getElementById('kbSaveBtn').textContent = '保存修改（' + id + '）';
  window.scrollTo(0, 0);
}

function kbEditCancel() {
  editingKb = null;
  ['kbQ', 'kbA', 'kbCat', 'kbKw'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('kbSaveBtn').textContent = '新增';
}

async function kbSave() {
  const req = {
    question: document.getElementById('kbQ').value.trim(),
    answer: document.getElementById('kbA').value.trim(),
    category: document.getElementById('kbCat').value.trim(),
    keywords: document.getElementById('kbKw').value.trim(),
  };
  if (!req.question || !req.answer) return CS.toast('问题与答案必填', true);
  try {
    if (editingKb) {
      await CS.put('/api/admin/kb/' + editingKb, req);
      CS.toast('已保存（旧版已存为历史版本）');
    } else {
      await CS.post('/api/admin/kb', req);
      CS.toast('FAQ 已新增');
    }
    kbEditCancel();
    loadKb();
  } catch (e) { CS.toast(e.message, true); }
}

async function kbVersions(id) {
  try {
    const list = await CS.get('/api/admin/kb/' + id + '/versions');
    document.getElementById('kbVerCard').style.display = '';
    document.getElementById('kbVerId').textContent = id;
    document.getElementById('kbVersions').innerHTML = list.length ?
      '<table><tr><th>版本</th><th>保存时间</th><th>操作人</th><th>问题</th><th>答案摘要</th><th>操作</th></tr>' +
      list.map(v => `<tr><td class="mono">#${v.id}</td><td class="muted">${CS.time(v.savedAt)}</td>
        <td>${CS.esc(v.savedBy || '-')}</td><td>${CS.esc(v.question)}</td>
        <td>${CS.esc((v.answer || '').slice(0, 60))}…</td>
        <td><button class="small ghost" onclick="kbRollback('${id}',${v.id})">回滚到此版</button></td></tr>`).join('') + '</table>'
      : '<div class="empty">暂无历史版本（编辑保存后自动生成）</div>';
  } catch (e) { CS.toast(e.message, true); }
}

async function kbRollback(id, revId) {
  if (!confirm('确认回滚 ' + id + ' 到版本 #' + revId + '？当前内容会先存为新版本。')) return;
  try {
    await CS.post(`/api/admin/kb/${id}/rollback/${revId}`);
    CS.toast('已回滚');
    loadKb(); kbVersions(id);
  } catch (e) { CS.toast(e.message, true); }
}

async function kbDelete(id) {
  if (!confirm('确认删除 FAQ ' + id + '？')) return;
  try { await CS.del('/api/admin/kb/' + id); CS.toast('已删除'); loadKb(); }
  catch (e) { CS.toast(e.message, true); }
}

// ---- LLM 审计 ----
let llmPage = 1;
const LLM_SIZE = 20;

async function loadLlm(page = llmPage) {
  llmPage = page;
  const status = document.getElementById('llmStatus').value;
  const d = await CS.get(`/api/admin/llm-calls?page=${page}&size=${LLM_SIZE}` + (status ? '&status=' + status : ''));
  document.getElementById('llmList').innerHTML = d.list.length ?
    '<table><tr><th>ID</th><th>会话</th><th>模型</th><th>提示版本</th><th>Tokens</th><th>耗时</th><th>状态</th><th>时间</th></tr>' +
    d.list.map(c => `<tr><td class="mono">${c.id}</td><td class="mono">${CS.esc(c.sessionId || '-')}</td>
      <td>${CS.esc(c.model || '-')}</td><td class="mono">${CS.esc(c.promptVersion || '-')}</td>
      <td>${(c.promptTokens || 0) + (c.completionTokens || 0)}</td>
      <td>${c.latencyMs || 0}ms</td>
      <td>${c.status === 'OK' ? '<span class="badge ok">OK</span>' : '<span class="badge err" title="' + CS.esc(c.error || '') + '">' + CS.esc(c.status) + '</span>'}</td>
      <td class="muted">${CS.time(c.createdAt)}</td></tr>`).join('') + '</table>'
    : '<div class="empty">暂无调用记录（未配置 LLM Key 时为 FAQ 模式）</div>';
  CS.pager('llmPager', d.total, page, LLM_SIZE, 'loadLlm');
}

// ---- 租户与订阅 ----
let subPage = 1, codePage = 1, orderPage = 1;
const SUB_SIZE = 10, CODE_SIZE = 10, ORDER_SIZE = 10;

async function loadSubs(page = subPage) {
  subPage = page;
  const d = await CS.get(`/api/admin/subscriptions?page=${page}&size=${SUB_SIZE}`);
  document.getElementById('subList').innerHTML = d.list.length ?
    '<table><tr><th>租户</th><th>编码</th><th>状态</th><th>订阅</th><th>到期</th><th>来源</th><th>操作</th></tr>' +
    d.list.map(r => `<tr><td>${CS.esc(r.tenant.name)}</td><td class="mono">${CS.esc(r.tenant.code)}</td>
      <td>${CS.statusBadge(r.tenant.status)}</td>
      <td>${r.subscribed ? '<span class="badge ok">已订阅</span>' : '<span class="badge gray">免费</span>'}</td>
      <td class="muted">${r.subscription ? CS.day(r.subscription.expireAt) : '-'}</td>
      <td class="muted">${r.subscription ? CS.esc(r.subscription.source) : '-'}</td>
      <td><button class="small ghost" onclick="freeze('${r.tenant.id}','${r.tenant.status === 'ACTIVE' ? 'FROZEN' : 'ACTIVE'}')">
        ${r.tenant.status === 'ACTIVE' ? '冻结' : '解冻'}</button></td></tr>`).join('') + '</table>'
    : '<div class="empty">暂无租户</div>';
  CS.pager('subPager', d.total, page, SUB_SIZE, 'loadSubs');
}

async function loadCodes(page = codePage) {
  codePage = page;
  const status = document.getElementById('codeStatus').value;
  const d = await CS.get(`/api/admin/codes?page=${page}&size=${CODE_SIZE}` + (status ? '&status=' + status : ''));
  document.getElementById('codeList').innerHTML = d.list.length ?
    '<table><tr><th>激活码</th><th>天数</th><th>套餐</th><th>状态</th><th>兑换租户</th></tr>' +
    d.list.map(c => `<tr><td class="mono">${c.code}</td><td>${c.days}</td>
      <td class="mono">${CS.esc(c.planCode || '-')}</td><td>${CS.statusBadge(c.status)}</td>
      <td class="mono">${CS.esc(c.usedByTenant || '-')}</td></tr>`).join('') + '</table>'
    : '<div class="empty">暂无激活码</div>';
  CS.pager('codePager', d.total, page, CODE_SIZE, 'loadCodes');
}

async function loadOrders(page = orderPage) {
  orderPage = page;
  const d = await CS.get(`/api/admin/sub-orders?page=${page}&size=${ORDER_SIZE}`);
  document.getElementById('subOrders').innerHTML = d.list.length ?
    '<table><tr><th>单号</th><th>金额</th><th>状态</th><th>创建</th></tr>' +
    d.list.map(o => `<tr><td class="mono">${o.id}</td><td>¥${CS.yuan(o.amount)}</td>
      <td>${CS.statusBadge(o.status)}</td><td class="muted">${CS.time(o.createdAt)}</td></tr>`).join('') + '</table>'
    : '<div class="empty">暂无支付单</div>';
  CS.pager('orderPager', d.total, page, ORDER_SIZE, 'loadOrders');
}

async function grant() {
  const tenantId = document.getElementById('grantTenant').value.trim();
  const days = Number(document.getElementById('grantDays').value);
  if (!tenantId) return CS.toast('请填写租户 ID', true);
  try {
    const sub = await CS.post('/api/admin/subscriptions/grant', { tenantId, days });
    CS.toast('已开通，到期 ' + CS.day(sub.expireAt));
    loadSubs();
  } catch (e) { CS.toast(e.message, true); }
}

async function genCodes() {
  try {
    const codes = await CS.post('/api/admin/codes/generate', {
      days: Number(document.getElementById('codeDays').value),
      count: Number(document.getElementById('codeCount').value),
    });
    CS.toast('已生成 ' + codes.length + ' 个激活码');
    loadCodes(1);
  } catch (e) { CS.toast(e.message, true); }
}

async function createTenant() {
  try {
    await CS.post('/api/admin/tenants', {
      code: document.getElementById('newCode').value.trim(),
      name: document.getElementById('newName').value.trim(),
    });
    CS.toast('租户已创建');
    loadSubs();
  } catch (e) { CS.toast(e.message, true); }
}

async function freeze(id, status) {
  try {
    await CS.post(`/api/admin/tenants/${id}/status`, { status });
    CS.toast(status === 'FROZEN' ? '已冻结' : '已解冻');
    loadSubs();
  } catch (e) { CS.toast(e.message, true); }
}

// ---- 审计与坏例 ----
let auditPage = 1, badPage = 1, evtPage = 1;
const AUDIT_SIZE = 20, BAD_SIZE = 10, EVT_SIZE = 20;

async function loadAudit(page = auditPage) {
  auditPage = page;
  const action = document.getElementById('auditAction').value.trim();
  const d = await CS.get(`/api/admin/audit-log?page=${page}&size=${AUDIT_SIZE}` + (action ? '&action=' + encodeURIComponent(action) : ''));
  document.getElementById('auditList').innerHTML = d.list.length ?
    '<table><tr><th>ID</th><th>时间</th><th>操作人</th><th>动作</th><th>对象</th><th>详情</th></tr>' +
    d.list.map(a => `<tr><td class="mono">${a.id}</td><td class="muted">${CS.time(a.createdAt)}</td>
      <td>${CS.esc(a.actor)}</td><td class="mono">${CS.esc(a.action)}</td>
      <td class="mono">${CS.esc(a.target || '-')}</td><td>${CS.esc(a.detail || '-')}</td></tr>`).join('') + '</table>'
    : '<div class="empty">暂无审计记录</div>';
  CS.pager('auditPager', d.total, page, AUDIT_SIZE, 'loadAudit');
}

async function loadBad(page = badPage) {
  badPage = page;
  const d = await CS.get(`/api/admin/badcases?page=${page}&size=${BAD_SIZE}`);
  document.getElementById('badList').innerHTML = d.list.length ?
    '<table><tr><th>会话</th><th>用户</th><th>租户</th><th>原因</th><th>最近提问</th></tr>' +
    d.list.map(b => `<tr style="cursor:pointer" onclick="showBadMsgs('${b.session.id}')">
      <td class="mono">${b.session.id}</td><td>${CS.esc(b.session.userName || b.session.userId)}</td>
      <td>${CS.esc(b.session.tenantCode)}</td>
      <td>${b.reasons.map(r => '<span class="badge warn">' + CS.esc(r) + '</span>').join(' ')}</td>
      <td>${CS.esc(b.lastUser || '')}</td></tr>`).join('') + '</table>'
    : '<div class="empty">暂无坏例</div>';
  CS.pager('badPager', d.total, page, BAD_SIZE, 'loadBad');
}

async function showBadMsgs(id) {
  try {
    const list = await CS.get('/api/admin/sessions/' + id + '/messages');
    document.getElementById('badDetail').innerHTML =
      `<h3 style="margin-top:12px">会话上下文 <span class="mono">${id}</span></h3>
      <div style="max-height:300px;overflow:auto">` +
      (list.length ? list.map(m => `<p style="font-size:13px;margin-bottom:8px">
        <b>${m.role === 'USER' ? '用户' : '机器人'}</b>
        <span class="muted">${CS.time(m.createdAt)}</span>
        ${m.kbRefs ? '<span class="mono muted"> refs:' + CS.esc(m.kbRefs) + '</span>' : ''}
        <br>${CS.esc(m.content || '')}</p>`).join('')
        : '<div class="empty">暂无消息</div>') + '</div>';
  } catch (e) { CS.toast(e.message, true); }
}

async function loadEvents(page = evtPage) {
  evtPage = page;
  const d = await CS.get(`/api/admin/proactive-events?page=${page}&size=${EVT_SIZE}`);
  document.getElementById('evtList').innerHTML = d.list.length ?
    '<table><tr><th>事件键</th><th>租户</th><th>用户</th><th>会话</th><th>状态</th><th>内容</th><th>时间</th></tr>' +
    d.list.map(e => `<tr><td class="mono">${CS.esc(e.eventKey)}</td><td class="mono">${CS.esc(e.tenantId)}</td>
      <td>${CS.esc(e.userId)}</td><td class="mono">${CS.esc(e.sessionId || '-')}</td>
      <td>${CS.statusBadge(e.status)}</td><td>${CS.esc((e.payload || '').slice(0, 60))}</td>
      <td class="muted">${CS.time(e.createdAt)}</td></tr>`).join('') + '</table>'
    : '<div class="empty">暂无主动服务事件</div>';
  CS.pager('evtPager', d.total, page, EVT_SIZE, 'loadEvents');
}

// ---- 开放与账单 ----
let keyPage = 1, invPage = 1;
const KEY_SIZE = 10, INV_SIZE = 10;

async function loadKeys(page = keyPage) {
  keyPage = page;
  const tc = document.getElementById('keyTenant').value.trim();
  const d = await CS.get(`/api/admin/open-keys?page=${page}&size=${KEY_SIZE}` + (tc ? '&tenantCode=' + encodeURIComponent(tc) : ''));
  document.getElementById('keyList').innerHTML = d.list.length ?
    '<table><tr><th>API Key</th><th>租户</th><th>状态</th><th>创建</th><th>操作</th></tr>' +
    d.list.map(k => `<tr><td class="mono">${CS.esc(k.apiKey)}</td><td class="mono">${CS.esc(k.tenantId)}</td>
      <td>${k.status === 'ACTIVE' ? '<span class="badge ok">有效</span>' : '<span class="badge gray">已吊销</span>'}</td>
      <td class="muted">${CS.time(k.createdAt)}</td>
      <td>${k.status === 'ACTIVE' ? `<button class="small danger" onclick="revokeKey('${CS.esc(k.apiKey)}')">吊销</button>` : '-'}</td></tr>`).join('') + '</table>'
    : '<div class="empty">暂无凭证</div>';
  CS.pager('keyPager', d.total, page, KEY_SIZE, 'loadKeys');
}

async function genKey() {
  const tenantCode = document.getElementById('keyGenTenant').value.trim();
  if (!tenantCode) return CS.toast('请填写租户编码', true);
  try {
    const k = await CS.post('/api/admin/open-keys', { tenantCode });
    document.getElementById('keyNew').innerHTML =
      `<p style="font-size:13px;margin-bottom:8px">新凭证（secret 仅此次展示，请妥善保存）：<br>
      <span class="mono">X-Open-Key: ${CS.esc(k.apiKey)}</span><br>
      <span class="mono">secret: ${CS.esc(k.secret)}</span></p>`;
    CS.toast('凭证已生成');
    loadKeys(1);
  } catch (e) { CS.toast(e.message, true); }
}

async function revokeKey(apiKey) {
  if (!confirm('确认吊销凭证 ' + apiKey + '？吊销后该 Key 立即失效。')) return;
  try {
    await CS.post(`/api/admin/open-keys/${apiKey}/revoke`);
    CS.toast('已吊销');
    loadKeys();
  } catch (e) { CS.toast(e.message, true); }
}

async function loadInv(page = invPage) {
  invPage = page;
  const tc = document.getElementById('invTenant').value.trim();
  const p = document.getElementById('invPeriod').value.trim();
  const d = await CS.get(`/api/admin/invoices?page=${page}&size=${INV_SIZE}` +
    (tc ? '&tenantCode=' + encodeURIComponent(tc) : '') + (p ? '&period=' + encodeURIComponent(p) : ''));
  document.getElementById('invList').innerHTML = d.list.length ?
    '<table><tr><th>账单号</th><th>租户</th><th>账期</th><th>Tokens</th><th>调用</th><th>金额</th><th>套餐</th></tr>' +
    d.list.map(i => `<tr><td class="mono">${CS.esc(i.id)}</td><td class="mono">${CS.esc(i.tenantId)}</td>
      <td>${CS.esc(i.period)}</td><td>${(i.promptTokens || 0) + (i.completTokens || 0)}</td>
      <td>${i.calls}</td><td>¥${CS.yuan(i.amount)}</td><td class="mono">${CS.esc(i.planCode || '-')}</td></tr>`).join('') + '</table>'
    : '<div class="empty">暂无账单</div>';
  CS.pager('invPager', d.total, page, INV_SIZE, 'loadInv');
}

async function genInvoice() {
  const tenantCode = document.getElementById('invGenTenant').value.trim();
  const period = document.getElementById('invGenPeriod').value.trim();
  if (!tenantCode || !period) return CS.toast('请填写租户编码与账期', true);
  try {
    const inv = await CS.post('/api/admin/invoices/generate', { tenantCode, period });
    CS.toast('已出账 ¥' + CS.yuan(inv.amount));
    loadInv(1);
  } catch (e) { CS.toast(e.message, true); }
}

document.getElementById('token').value = localStorage.getItem(CS.tokenKey) || '';
refresh();
</script>
