<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工单工作台 · cs-pro</title>
<link rel="stylesheet" href="common.css">
</head>
<body>
<div class="topbar">
  <h1>工单工作台</h1>
  <span class="spacer"></span>
  <a href="admin.html">管理后台</a>
  <a href="index.html">首页</a>
</div>
<div class="wrap">
  <div class="card">
    <div class="row">
      <div style="min-width:180px">
        <label>管理令牌（X-Admin-Token）</label>
        <input id="token" type="password" placeholder="默认 cs-admin">
      </div>
      <div style="min-width:130px">
        <label>状态过滤</label>
        <select id="statusFilter" onchange="loadList(1)">
          <option value="">全部</option>
          <option value="OPEN" selected>待处理</option>
          <option value="PROCESSING">处理中</option>
          <option value="RESOLVED">已解决</option>
          <option value="CLOSED">已关闭</option>
          <option value="CANCELLED">已取消</option>
        </select>
      </div>
      <button onclick="saveToken();loadList()" style="align-self:flex-end">刷新</button>
    </div>
  </div>

  <div class="grid cols-2">
    <div class="card">
      <h2>会话服务（人工接管）<button class="small ghost" onclick="loadSessions()">刷新</button></h2>
      <div class="muted" style="margin-bottom:6px">用户点「转人工」后进入服务中列表；接管后智能助手暂停，回复以【人工客服】标识发送。</div>
      <div id="sessList"><div class="empty">加载中…</div></div>
    </div>
    <div class="card">
      <h2>会话详情 <span class="muted" id="sessId"></span></h2>
      <div id="sessMsgs" style="max-height:360px;overflow:auto"><div class="empty">点击左侧会话查看</div></div>
      <div id="sessActions"></div>
    </div>
  </div>

  <div class="card">
    <h2>坏例队列 <button class="small ghost" onclick="loadBadcases()">刷新</button></h2>
    <div class="muted" style="margin-bottom:6px">差评 / 智能助手降级的会话；点开查看上下文，再到管理后台改进知识库。</div>
    <div id="badcaseList"><div class="empty">加载中…</div></div>
    <div id="badPager"></div>
    <div id="badcaseDetail"></div>
  </div>

  <div class="grid cols-2">
    <div class="card">
      <h2>工单列表 <span class="muted" id="totalInfo"></span></h2>
      <div id="list"><div class="empty">加载中…</div></div>
      <div id="ticketPager"></div>
    </div>
    <div class="card">
      <h2>工单详情</h2>
      <div id="detail"><div class="empty">点击左侧工单查看</div></div>
    </div>
  </div>
</div>
<script src="common.js"></script>
<script>
let current = null;
let tkPage = 1;
const TK_SIZE = 10;

function saveToken() {
  const t = document.getElementById('token').value.trim();
  if (t) localStorage.setItem(CS.tokenKey, t);
}

async function loadList(page = tkPage) {
  tkPage = page;
  const status = document.getElementById('statusFilter').value;
  try {
    const d = await CS.get(`/api/admin/tickets?page=${page}&size=${TK_SIZE}` + (status ? '&status=' + status : ''));
    document.getElementById('totalInfo').textContent = '共 ' + d.total + ' 条';
    const el = document.getElementById('list');
    if (!d.list.length) { el.innerHTML = '<div class="empty">暂无工单</div>'; }
    else {
      el.innerHTML = '<table><tr><th>工单</th><th>分类</th><th>摘要</th><th>状态</th></tr>' +
        d.list.map(t => `<tr style="cursor:pointer" onclick="openDetail('${t.id}')">
          <td class="mono">${t.id}${t.priority === 'URGENT' ? ' <span class="badge err">急</span>' : ''}</td>
          <td>${CS.esc(t.category)}</td><td>${CS.esc(t.summary)}</td>
          <td>${CS.statusBadge(t.status)}</td></tr>`).join('') + '</table>';
    }
    CS.pager('ticketPager', d.total, page, TK_SIZE, 'loadList');
  } catch (e) {
    document.getElementById('list').innerHTML = `<div class="empty">${CS.esc(e.message)}</div>`;
  }
}

async function openDetail(id) {
  try {
    const d = await CS.get('/api/admin/tickets/' + id);
    current = d.ticket;
    const t = d.ticket;
    const actions = [];
    if (t.status === 'OPEN') {
      actions.push(`<div class="row" style="margin-top:10px">
        <input id="assignee" placeholder="处理人姓名" style="flex:1">
        <button onclick="doAssign()">认领处理</button></div>`);
    }
    if (t.status === 'PROCESSING') {
      actions.push(`<div style="margin-top:10px">
        <label>解决方案</label><textarea id="solution" placeholder="填写处理结果"></textarea>
        <button onclick="doResolve()" style="margin-top:8px">标记已解决</button></div>`);
    }
    if (t.status === 'RESOLVED') {
      actions.push(`<div style="margin-top:10px"><button class="ghost" onclick="doClose()">关闭工单</button>
        <span class="muted">（7 天未关闭将自动关闭）</span></div>`);
    }
    document.getElementById('detail').innerHTML = `
      <div class="row">
        <span class="mono">${t.id}</span> ${CS.statusBadge(t.status)}
        <span class="badge">${CS.esc(t.category)}</span>
        ${t.priority === 'URGENT' ? '<span class="badge err">紧急</span>' : ''}
      </div>
      <p style="margin:10px 0;font-size:14px">${CS.esc(t.summary)}</p>
      ${t.attachments ? '<div class="attach-strip">' + t.attachments.split(',').map(u =>
        `<a href="${CS.esc(u)}" target="_blank"><img class="thumb" src="${CS.esc(u)}"></a>`).join('') + '</div>' : ''}
      <p class="muted">用户 ${CS.esc(t.userId)} · 来源 ${CS.esc(t.source)} · 创建 ${CS.time(t.createdAt)}
        ${t.orderId ? ' · 订单 ' + CS.esc(t.orderId) : ''}
        ${t.assignee ? ' · 处理人 ' + CS.esc(t.assignee) : ''}</p>
      ${t.solution ? `<p style="margin-top:8px;font-size:13px"><b>解决方案：</b>${CS.esc(t.solution)}</p>` : ''}
      ${actions.join('')}
      <h3 style="margin-top:14px">跟进备注</h3>
      <div id="notes">${d.notes.length ? d.notes.map(n =>
        `<p style="font-size:13px;margin-bottom:6px"><b>${CS.esc(n.author)}</b>
         <span class="muted">${CS.time(n.createdAt)}</span><br>${CS.esc(n.content)}</p>`).join('')
        : '<div class="empty">暂无备注</div>'}</div>
      <div class="row" style="margin-top:8px">
        <input id="noteInput" placeholder="添加备注…" style="flex:1"
               onkeydown="if(event.key==='Enter')addNote()">
        <button class="small" onclick="addNote()">添加</button>
      </div>`;
  } catch (e) { CS.toast(e.message, true); }
}

async function doAssign() {
  const assignee = document.getElementById('assignee').value.trim();
  if (!assignee) return CS.toast('请填写处理人', true);
  try {
    await CS.post(`/api/admin/tickets/${current.id}/assign`, { assignee });
    CS.toast('已认领');
    openDetail(current.id); loadList();
  } catch (e) { CS.toast(e.message, true); }
}

async function doResolve() {
  const solution = document.getElementById('solution').value.trim();
  if (!solution) return CS.toast('请填写解决方案', true);
  try {
    await CS.post(`/api/admin/tickets/${current.id}/resolve`, { solution });
    CS.toast('已标记解决');
    openDetail(current.id); loadList();
  } catch (e) { CS.toast(e.message, true); }
}

async function doClose() {
  try {
    await CS.post(`/api/admin/tickets/${current.id}/close`);
    CS.toast('已关闭');
    openDetail(current.id); loadList();
  } catch (e) { CS.toast(e.message, true); }
}

async function addNote() {
  const content = document.getElementById('noteInput').value.trim();
  if (!content) return;
  try {
    await CS.post(`/api/admin/tickets/${current.id}/notes`, { author: '客服', content });
    openDetail(current.id);
  } catch (e) { CS.toast(e.message, true); }
}

// ---- 会话人工接管 ----
let curSess = null;

async function loadSessions() {
  try {
    const d = await CS.get('/api/admin/sessions?status=ACTIVE&size=50');
    const el = document.getElementById('sessList');
    if (!d.list.length) { el.innerHTML = '<div class="empty">暂无进行中会话</div>'; return; }
    const sorted = d.list.slice().sort((a, b) => (b.takeover ? 1 : 0) - (a.takeover ? 1 : 0));
    el.innerHTML = '<table><tr><th>会话</th><th>用户</th><th>意图</th><th>服务方</th></tr>' +
      sorted.map(s => `<tr style="cursor:pointer" onclick="openSession('${s.id}')">
        <td class="mono">${s.id}</td>
        <td>${CS.esc(s.userName || s.userId)}<span class="muted">（${CS.esc(s.userRole)}）</span></td>
        <td>${CS.esc(s.intent || '其他')}</td>
        <td>${s.takeover ? '<span class="badge warn">待人工</span>' : '<span class="badge ok">智能助手</span>'}</td>
      </tr>`).join('') + '</table>';
  } catch (e) {
    document.getElementById('sessList').innerHTML = `<div class="empty">${CS.esc(e.message)}</div>`;
  }
}

async function openSession(id) {
  curSess = id;
  document.getElementById('sessId').textContent = id;
  await Promise.all([loadSessMsgs(), loadSessState()]);
}

async function loadSessMsgs() {
  if (!curSess) return;
  try {
    const list = await CS.get('/api/admin/sessions/' + curSess + '/messages');
    document.getElementById('sessMsgs').innerHTML =
      (list.length ? list.map(m => `<p style="font-size:13px;margin-bottom:8px">
        <b>${m.role === 'USER' ? CS.esc('用户') : '客服'}</b>
        <span class="muted">${CS.time(m.createdAt)}</span><br>${CS.esc(m.content)}
        ${m.attachments ? '<span class="attach-strip">' + m.attachments.split(',').map(u =>
          `<a href="${CS.esc(u)}" target="_blank"><img class="thumb" src="${CS.esc(u)}"></a>`).join('') + '</span>' : ''}</p>`).join('')
        : '<div class="empty">暂无消息</div>');
    const box = document.getElementById('sessMsgs');
    box.scrollTop = box.scrollHeight;
  } catch (e) { /* 轮询失败忽略 */ }
}

async function loadSessState() {
  if (!curSess) return;
  try {
    const d = await CS.get('/api/admin/sessions?status=ACTIVE&size=50');
    const s = d.list.find(x => x.id === curSess);
    if (!s) { document.getElementById('sessActions').innerHTML = '<div class="muted">会话已结束</div>'; return; }
    document.getElementById('sessActions').innerHTML = s.takeover
      ? `<div class="row" style="margin-top:10px">
           <input id="replyInput" placeholder="以人工客服身份回复…" style="flex:1"
                  onkeydown="if(event.key==='Enter')agentSend()">
           <button class="small" onclick="agentSend()">回复</button>
           <button class="small ghost" onclick="handback()">交还助手</button></div>`
      : `<div style="margin-top:10px"><button class="small" onclick="takeover()">接管会话</button>
           <span class="muted">接管后智能助手暂停，用户消息将排队等待人工回复</span></div>`;
  } catch (e) { /* 忽略 */ }
}

async function takeover() {
  try {
    await CS.post(`/api/admin/sessions/${curSess}/takeover`, { agent: '客服' });
    CS.toast('已接管');
    loadSessions(); loadSessState();
  } catch (e) { CS.toast(e.message, true); }
}

async function handback() {
  try {
    await CS.post(`/api/admin/sessions/${curSess}/handback`);
    CS.toast('已交还智能助手');
    loadSessions(); loadSessState();
  } catch (e) { CS.toast(e.message, true); }
}

async function agentSend() {
  const input = document.getElementById('replyInput');
  const content = input.value.trim();
  if (!content) return;
  try {
    await CS.post(`/api/admin/sessions/${curSess}/messages`, { content });
    input.value = '';
    loadSessMsgs();
  } catch (e) { CS.toast(e.message, true); }
}

// ---- 坏例队列 ----
let badPage = 1;
const BAD_SIZE = 10;

async function loadBadcases(page = badPage) {
  badPage = page;
  try {
    const d = await CS.get(`/api/admin/badcases?page=${page}&size=${BAD_SIZE}`);
    const el = document.getElementById('badcaseList');
    if (!d.list.length) { el.innerHTML = '<div class="empty">暂无坏例</div>'; }
    else {
      el.innerHTML = '<table><tr><th>会话</th><th>用户</th><th>原因</th><th>最近提问</th><th>引用</th></tr>' +
        d.list.map(b => `<tr style="cursor:pointer" onclick="openBadcase('${b.session.id}')">
          <td class="mono">${b.session.id}</td>
          <td>${CS.esc(b.session.userName || b.session.userId)}</td>
          <td>${b.reasons.map(r => '<span class="badge warn">' + CS.esc(r) + '</span>').join(' ')}</td>
          <td>${CS.esc(b.lastUser || '')}</td>
          <td class="mono">${CS.esc(b.kbRefs || '-')}</td></tr>`).join('') + '</table>';
    }
    CS.pager('badPager', d.total, page, BAD_SIZE, 'loadBadcases');
  } catch (e) {
    document.getElementById('badcaseList').innerHTML = `<div class="empty">${CS.esc(e.message)}</div>`;
  }
}

async function openBadcase(id) {
  try {
    const list = await CS.get('/api/admin/sessions/' + id + '/messages');
    document.getElementById('badcaseDetail').innerHTML =
      `<h3 style="margin-top:12px">会话上下文 <span class="mono">${id}</span>
        <a href="admin.html" target="_blank"><button class="small ghost">去 KB 编辑</button></a></h3>
      <div style="max-height:300px;overflow:auto">` +
      (list.length ? list.map(m => `<p style="font-size:13px;margin-bottom:8px">
        <b>${m.role === 'USER' ? '用户' : '机器人'}</b>
        <span class="muted">${CS.time(m.createdAt)}</span>
        ${m.kbRefs ? '<span class="mono muted"> refs:' + CS.esc(m.kbRefs) + '</span>' : ''}
        <br>${CS.esc(m.content)}</p>`).join('')
        : '<div class="empty">暂无消息</div>') + '</div>';
  } catch (e) { CS.toast(e.message, true); }
}

document.getElementById('token').value = localStorage.getItem(CS.tokenKey) || '';
loadList();
loadSessions();
loadBadcases();
setInterval(() => { loadSessions(); loadSessMsgs(); }, 5000);
</script>
</body>
</html>
