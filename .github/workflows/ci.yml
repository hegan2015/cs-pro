name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp package

      - name: Upload gateway jar
        uses: actions/upload-artifact@v4
        with:
          name: cs-gateway
          path: cs-gateway/target/cs-gateway.jar
          if-no-files-found: error